# The player as a site: worker.ts beside this file serves an R2 bucket that
# `npm run deploy` (web/tools/deploy.ts) fills, under a secret path. README.md
# is the procedure; `npm run deploy` runs `wrangler deploy` here itself the
# first time.
#
# The page is then at https://hotd2-site.<your-subdomain>.workers.dev/<SITE_KEY>/

name = "hotd2-site"
main = "worker.ts"
compatibility_date = "2025-09-01"

[[r2_buckets]]
binding = "SITE"
# Must be the deploy's R2_BUCKET (r2site/.deploy.env); `npm run deploy` checks.
bucket_name = "hotd2"

# Secrets, never in this file -- `npm run deploy` sets it from .deploy.env:
#
#   SITE_KEY   the path segment the site is served under
