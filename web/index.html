<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOTD2 stage player</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <span class="brand">HOTD2 <span class="dim">stage player</span></span>
        <label>Stage <select id="stage-select"></select></label>
        <label title="Game mode 1. Same regions; a few slots resolve to the st_org* models Arcade never draws.">
          <input type="checkbox" id="original-toggle" /> Original
        </label>
        <span class="sep"></span>
        <div class="modes" role="tablist">
          <button data-mode="step" class="mode">Step</button>
          <button data-mode="play" class="mode">Play</button>
          <button data-mode="free" class="mode">Free roam</button>
        </div>
        <span class="sep"></span>
        <label title="Draw every region at once. Consecutive regions overlap heavily, so this is how the interpenetration becomes legible as a deliberate mechanism rather than an export bug.">
          <input type="checkbox" id="all-regions" /> All regions
        </label>
        <label title="Camera eye rails, one polyline per cam/ path."><input type="checkbox" id="show-rails" checked /> Rails</label>
        <label title="The look-at track: where each camera path is aimed, as opposed to where it sits."><input type="checkbox" id="show-aim" /> Look-at</label>
        <label title="The camera-following backdrop dome the script selects with evt 0x1B/0x1C."><input type="checkbox" id="show-sky" checked /> Sky</label>
        <label title="The screen-space layer: the letterbox shutter (evt 0x1F) and the dialogue subtitles (evt 0x2D)."><input type="checkbox" id="show-hud" checked /> HUD</label>
        <label title="Objects that ride op_ object paths — vehicles and props, assembled from transcribed draw routines. They appear only while the camera is on a path that selects them."><input type="checkbox" id="show-rigs" checked /> Rigs</label>
        <label><input type="checkbox" id="show-spawns" checked /> Spawns</label>
        <label title="Spawned characters assembled from the EXE skeleton and posed from mot/. A spawn whose class has no motion rule yet keeps its marker instead — an unposed character is a heap of parts, not a character."><input type="checkbox" id="show-chars" checked /> Characters</label>
        <label title="Scripted scenery: doors, shutters and the vans they hang off. They swing when the script sets their flag (evt 0x48) and vanish on a second one. Also draws a bounding box and an origin cross on every prop the bundle names — green drawn, amber hidden, magenta no geometry, red no glTF node — so a prop that is not on screen can be told from one that was never exported."><input type="checkbox" id="show-props" checked /> Props</label>
        <label title="The class-0x41 breakable props — the barrels and boxes the game hides its items in. Built at run time by PlaceBreakableGroup from the exe's own member records, two shots each, and a stack collapses when what it stands on is destroyed."><input type="checkbox" id="show-breakables" checked /> Breakables</label>
        <label title="Empty boxes wherever the script has spawned an actor whose class has no module in the port's g_class_handlers. The game would be running a state machine for it; this player is not. docs/formats/spawns.md says what each class is."><input type="checkbox" id="show-unported" /> Unported</label>
        <label title="The game's own coli/ collision, as the port traces it: amber for the blobs the script has selected into the sphere-and-segment set, blue for the ray-only ones, with a spike on each quad's normal so the one-sided winding is visible. A quad in neither set is not tested by anything and is not drawn."><input type="checkbox" id="show-coli" /> Collision</label>
        <label title="Which enemies are wedged. ZombiePushOutOfWorldAndActors traces every zombie's body sphere against the selected collision each frame and shoves it back out; one frame of that is normal, half a second of it is an actor that cannot get where its state is taking it. Marks those in red at the sphere the push actually tests. Counts only the world half, not the shoulder-past-another-zombie half."><input type="checkbox" id="show-stuck" /> Wedged</label>
        <label title="Bounding boxes on the actor holding an attack permit — the one about to swing, and the one SelectCameraLookAtTarget is aiming at — and, while wait_enemies_alive is blocking, on every enemy keeping it blocked."><input type="checkbox" id="show-boxes" /> Boxes</label>
        <label title="The gameplay camera. With enemies registered, SelectCameraLookAtTarget aims at the one holding an attack permit -- the one about to swing -- or the midpoint of two, and TurnLookAtToward eases the camera onto it. Off restores the authored cam/ path exactly."><input type="checkbox" id="track-enemies" checked /> Track</label>
        <label title="Click to shoot. Ray from the camera through the crosshair, tested against each character's per-bone hit spheres; hit points, the per-bone damage escalation, the sever step, the sounds and the score are the game's own. With this on, the live-enemy waits become real: the script holds until you have killed them. See docs/formats/combat.md."><input type="checkbox" id="shoot" /> Shoot</label>
        <button id="btn-kill" class="kill" hidden
                title="Kill every live enemy outright -- hit points to zero and the directional death, the same thing that opens the live-enemy gate. Nothing is severed, because no bone was hit.">Kill</button>
        <button id="btn-save"
                title="Snapshot the whole game state: the walker's program counter and flags, the data segment, every actor and the random seed. Nothing from three.js -- the renderers rebuild from those, which is the test that the split is in the right place. See docs/PLAYER_ARCHITECTURE.md.">Save</button>
        <button id="btn-load" disabled
                title="Restore the last snapshot. The player becomes identical to the moment it was taken, down to the next attack the RNG draws.">Load</button>
        <label title="The game is 4:3 and its projection is a compile-time constant: 41.1 degrees vertical.">
          <input type="checkbox" id="pillarbox" checked /> 4:3
        </label>
        <label title="The game bakes most illumination into textures and the per-mesh base colour, so unlit is the faithful baseline. 'Scene' adds the one directional light SetLightingDefaultSingle installs, with the direction, colour and ambient the script sets.">
          Light
          <select id="light-mode">
            <option value="unlit" selected>unlit (baked)</option>
            <option value="scene">+ scene light</option>
          </select>
        </label>
        <label title="Fog colour and range come from the script (evt 0x20-0x27). Radial uses true distance from the eye; planar reproduces the game's view-space-Z falloff, which fogs the screen corners less than the centre.">
          Fog
          <select id="fog-mode">
            <option value="radial" selected>radial</option>
            <option value="planar">planar (as the game)</option>
            <option value="off">off</option>
          </select>
        </label>
        <span class="grow"></span>
        <span id="status" class="dim"></span>
      </header>

      <main id="stagearea">
        <aside id="left">
          <div class="panel-head">
            <strong>Script</strong>
            <input type="search" id="tree-filter" placeholder="filter…" />
          </div>
          <div id="tree" class="scroll"></div>
        </aside>

        <div
          id="left-resize"
          class="resizer"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize the script panel"
          aria-valuemin="130"
          aria-valuemax="620"
          tabindex="0"
          title="Drag to resize · double-click to reset"
        ></div>

        <div id="viewport">
          <canvas id="view"></canvas>
          <!-- Shown while the game clock is stopped and the viewer is meant to
               notice. Free roam stops the clock too but says so with its own
               mode button, so it does not raise this. -->
          <div id="paused-overlay" hidden><span>PAUSED</span></div>
          <div id="loading">
            <div class="spinner"></div>
            <p id="loading-text">loading bundle…</p>
          </div>

          <!-- Anchored to the bottom of the rendered view, not a modal over
               it: a branch point is a fact about where playback has got to,
               so the script, the scrubber and free roam all stay usable. -->
          <!-- Same anchoring as the branch bar below, and shown under the
               same rule the game uses: inside a set_skippable_region with the
               shutter's firing gate down. Where the branch bar asks a question
               that playback is waiting on, this one only offers something, so
               it never blocks and never counts down. -->
          <div id="skipbar" hidden>
            <span class="tag">Skip</span>
            <span id="skip-sub" class="dim"></span>
            <button id="skip-go">Skip ⏭</button>
            <kbd class="skip-key">Enter</kbd>
          </div>
          <div id="branchbar" hidden>
            <span class="tag">Branch</span>
            <span id="branch-sub" class="dim"></span>
            <span id="branch-buttons"></span>
            <span id="branch-countdown" class="countdown"></span>
          </div>
        </div>

        <aside id="right">
          <div id="hud" class="panel"></div>
          <details class="panel fold" id="panel-wait" open>
            <summary class="panel-head">
              <strong>Wait</strong>
              <span class="dim" id="wait-sub"></span>
              <label class="hl" title="Box every actor keeping this wait blocked."><input type="checkbox" id="hl-wait" /> box</label>
            </summary>
            <div id="wait-body" class="scroll dbg"></div>
          </details>
          <details class="panel fold" id="panel-actors">
            <summary class="panel-head">
              <strong>Actors</strong>
              <span class="dim" id="actor-sub" title="Every object in g_object_list, grouped by spawn class. Each class describes its own actors — a class with a module in g_class_handlers explains itself, one without is listed by id and left alone. docs/formats/spawns.md is the class table."></span>
            </summary>
            <div id="actor-body" class="scroll dbg"></div>
          </details>
          <details class="panel fold" id="panel-route">
            <summary class="panel-head"><strong>Route graph</strong></summary>
            <canvas id="minimap" height="150"></canvas>
          </details>
          <details class="panel fold grow-panel" id="panel-feed" open>
            <summary class="panel-head">
              <strong>Event feed</strong>
              <button id="feed-clear" class="mini">clear</button>
            </summary>
            <div id="feed" class="scroll"></div>
          </details>
          <details class="panel fold" id="inspector-panel">
            <summary class="panel-head"><strong>Inspector</strong></summary>
            <div id="inspector" class="scroll"></div>
          </details>
          <details class="panel fold" id="globals-panel">
            <summary class="panel-head">
              <strong>Globals</strong>
              <span class="dim" title="The port's data segment — every g_* it touches, and the object pool. Read-only: a writable panel would be a fourth way for state to enter the game, and nothing done here would survive a save. Addresses are the ones cited in web/src/game/globals.ts, checked against ghidra/annotations/globals.tsv.">read-only · g_*</span>
            </summary>
            <div id="globals" class="scroll"></div>
          </details>
        </aside>
      </main>

      <footer id="transport">
        <button id="btn-reset" title="Back to the entry block">⏮</button>
        <button id="btn-stepback" title="Previous instruction">◀</button>
        <button id="btn-play" title="Play / pause (space)">▶</button>
        <button id="btn-step" title="Next instruction (→)">▶|</button>
        <label class="speed">Speed
          <select id="speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
            <option value="8">8×</option>
          </select>
        </label>
        <span class="sep"></span>
        <button id="btn-sound" class="sound" aria-pressed="false"
                title="Sound on / off. Browsers block audio until the page is clicked, so this is also the gesture that unblocks it."><span id="sound-icon">🔇</span> <span id="sound-text">Muted</span></button>
        <input type="range" id="volume" min="0" max="100" step="1" value="60"
               title="BGM volume" />
        <span id="bgm-label" class="dim"></span>
        <span class="sep"></span>
        <label class="framebar">
          <span id="frame-label" class="dim">no camera path</span>
          <input type="range" id="frame-slider" min="0" max="1" step="1" value="0" />
        </label>
      </footer>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
